name: 每日更新简报

# 每天北京时间 06:30 自动抓取并重新发布；也可以到 Actions 页面手动点一下跑。
# GitHub 的服务器能正常访问 HTTPS，所以这里的抓取比本机覆盖面更广。

on:
  schedule:
    - cron: "30 22 * * *"   # UTC 22:30 = 北京时间次日 06:30
  workflow_dispatch:

permissions:
  contents: write           # 允许把新生成的快照提交回仓库
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 计算站点地址
        run: echo "SITE_URL=https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

      - name: 抓取并生成站点
        # SITE_URL 让 RSS 里的链接指向真实站点，而不是 localhost
        run: python scripts/fetch_news.py --quiet

      - name: 提交当天快照
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site
          git diff --staged --quiet || git commit -m "chore: 更新 $(date +'%Y-%m-%d') 简报"
          git push

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
